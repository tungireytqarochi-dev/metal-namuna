<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metall Katalog — 3D Mahsulotlar</title>
<script type="module" src="https://unpkg.com/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  :root{
    --ink:#1c1c1a;
    --paper:#f7f6f3;
    --steel:#3d4348;
    --steel-dark:#22262a;
    --rust:#b5502e;
    --line:#d9d6cf;
    --white:#ffffff;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Segoe UI', Arial, sans-serif;
    background:var(--paper);
    color:var(--ink);
    min-height:100vh;
  }
  header{
    background:var(--steel-dark);
    color:var(--white);
    padding:18px 28px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:4px solid var(--rust);
  }
  header .brand{
    font-size:20px;
    font-weight:700;
    letter-spacing:1px;
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:10px;
  }
  header .brand span{color:var(--rust);}
  nav button{
    background:transparent;
    border:1px solid #565f66;
    color:var(--white);
    padding:8px 16px;
    border-radius:4px;
    cursor:pointer;
    font-size:13px;
    margin-left:8px;
  }
  nav button:hover{background:var(--rust); border-color:var(--rust);}
  main{padding:28px; max-width:1200px; margin:0 auto;}

  /* CATALOG */
  .toolbar{display:flex; gap:10px; margin-bottom:22px; flex-wrap:wrap;}
  .toolbar input, .toolbar select{
    padding:10px 14px; border:1px solid var(--line); border-radius:4px; font-size:14px; background:var(--white);
  }
  .toolbar input{flex:1; min-width:200px;}
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
    gap:18px;
  }
  .card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:6px;
    overflow:hidden;
    cursor:pointer;
    transition:box-shadow .15s, transform .15s;
  }
  .card:hover{box-shadow:0 8px 20px rgba(0,0,0,.08); transform:translateY(-2px);}
  .card img{width:100%; height:160px; object-fit:cover; background:#eee; display:block;}
  .card .body{padding:12px 14px;}
  .card .code{font-size:11px; color:#999; letter-spacing:.5px;}
  .card .name{font-size:15px; font-weight:600; margin:4px 0;}
  .card .dims{font-size:12px; color:var(--steel);}
  .empty{text-align:center; padding:60px 20px; color:#999;}

  /* PRODUCT PAGE */
  .product-wrap{display:grid; grid-template-columns:1.3fr 1fr; gap:30px;}
  @media(max-width:800px){.product-wrap{grid-template-columns:1fr;}}
  model-viewer{
    width:100%; height:420px; background:var(--white);
    border:1px solid var(--line); border-radius:6px;
    --poster-color: transparent;
  }
  .info-panel{background:var(--white); border:1px solid var(--line); border-radius:6px; padding:22px;}
  .info-panel h1{font-size:22px; margin-bottom:6px;}
  .info-panel .code{color:#999; font-size:13px; margin-bottom:16px;}
  .dim-row{display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .dim-row b{color:var(--rust);}
  .desc{margin-top:14px; font-size:14px; line-height:1.6; color:#444;}
  .qr-box{margin-top:20px; text-align:center; padding-top:16px; border-top:1px solid var(--line);}
  .qr-box canvas{border:1px solid var(--line); border-radius:4px;}
  .qr-box p{font-size:12px; color:#999; margin-top:8px;}
  .back-link{display:inline-block; margin-bottom:16px; color:var(--steel); text-decoration:none; font-size:14px;}
  .back-link:hover{color:var(--rust);}

  /* ADMIN */
  .admin-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
  @media(max-width:700px){.admin-grid{grid-template-columns:1fr;}}
  .form-box{background:var(--white); border:1px solid var(--line); border-radius:6px; padding:20px; margin-bottom:20px;}
  .form-box label{display:block; font-size:12px; font-weight:600; margin:12px 0 4px; color:var(--steel);}
  .form-box input, .form-box textarea{
    width:100%; padding:9px 12px; border:1px solid var(--line); border-radius:4px; font-size:14px;
  }
  .form-box textarea{resize:vertical; min-height:70px;}
  .btn-primary{
    margin-top:16px; background:var(--rust); color:white; border:none; padding:11px 22px;
    border-radius:4px; cursor:pointer; font-size:14px; font-weight:600;
  }
  .btn-primary:hover{opacity:.9;}
  table{width:100%; border-collapse:collapse; background:var(--white); border:1px solid var(--line); border-radius:6px; overflow:hidden;}
  th, td{padding:10px 12px; text-align:left; font-size:13px; border-bottom:1px solid var(--line);}
  th{background:var(--steel-dark); color:white; font-weight:600;}
  tr:last-child td{border-bottom:none;}
  .row-actions button{
    border:none; background:none; cursor:pointer; font-size:13px; color:var(--steel); margin-right:10px;
  }
  .row-actions button.del{color:#b02a2a;}
  .hint{font-size:12px; color:#999; margin-top:-2px; margin-bottom:8px;}
</style>
</head>
<body>

<header>
  <div class="brand">METALL<span>KATALOG</span></div>
  <nav>
    <button onclick="navigate('catalog')">Katalog</button>
    <button onclick="navigate('admin')">Admin panel</button>
  </nav>
</header>

<main id="app"></main>

<script>
/* ---------- "DATABASE" (localStorage) ---------- */
const DB_KEY = 'metall_catalog_products_v1';

function loadProducts(){
  const raw = localStorage.getItem(DB_KEY);
  if(raw){ try { return JSON.parse(raw); } catch(e){ /* fallthrough */ } }
  const seed = [{
    id: crypto.randomUUID(),
    slug: 'gate-001',
    code: 'GT-001',
    name: 'Temir darvoza №001',
    category: 'Darvozalar',
    description: 'Zamonaviy uslubdagi metall darvoza, kirish qismlari uchun mo‘ljallangan. Kuchli po‘lat karkas va antikorroziy qoplama.',
    imageUrl: 'https://placehold.co/600x400/22262a/ffffff?text=Gate-001',
    glbUrl: 'https://modelviewer.dev/shared-assets/models/Astronaut.glb',
    lengthMm: 3000,
    heightMm: 2500,
    thicknessMm: 100,
    isActive: true,
    createdAt: Date.now()
  }];
  localStorage.setItem(DB_KEY, JSON.stringify(seed));
  return seed;
}
function saveProducts(list){ localStorage.setItem(DB_KEY, JSON.stringify(list)); }

let products = loadProducts();

/* ---------- ROUTER ---------- */
function currentRoute(){
  const hash = location.hash.slice(1) || 'catalog';
  const parts = hash.split('/');
  return { page: parts[0], param: parts[1] };
}
function navigate(page, param){
  location.hash = param ? `${page}/${param}` : page;
}
window.addEventListener('hashchange', render);
window.addEventListener('DOMContentLoaded', render);

function render(){
  const { page, param } = currentRoute();
  const app = document.getElementById('app');
  if(page === 'product' && param){
    app.innerHTML = renderProductPage(param);
    setTimeout(()=>drawQR(param), 0);
  } else if(page === 'admin'){
    app.innerHTML = renderAdmin();
  } else {
    app.innerHTML = renderCatalog();
  }
}

/* ---------- CATALOG PAGE ---------- */
function renderCatalog(){
  const cats = ['Barchasi', ...new Set(products.map(p=>p.category).filter(Boolean))];
  return `
    <div class="toolbar">
      <input id="searchInput" placeholder="Mahsulot nomi yoki kodi bo'yicha qidirish..." oninput="filterCatalog()">
      <select id="catFilter" onchange="filterCatalog()">
        ${cats.map(c=>`<option value="${c}">${c}</option>`).join('')}
      </select>
    </div>
    <div class="grid" id="catalogGrid">
      ${products.filter(p=>p.isActive).map(cardHtml).join('') || '<div class="empty">Hozircha mahsulot yo\'q. Admin panelda qo\'shing.</div>'}
    </div>
  `;
}
function cardHtml(p){
  return `
    <div class="card" onclick="navigate('product','${p.slug}')">
      <img src="${p.imageUrl || 'https://placehold.co/400x300?text=No+Image'}" alt="${p.name}">
      <div class="body">
        <div class="code">${p.code}</div>
        <div class="name">${p.name}</div>
        <div class="dims">${p.lengthMm}×${p.heightMm}${p.thicknessMm ? '×'+p.thicknessMm : ''} mm</div>
      </div>
    </div>
  `;
}
function filterCatalog(){
  const q = document.getElementById('searchInput').value.toLowerCase();
  const cat = document.getElementById('catFilter').value;
  const filtered = products.filter(p=>{
    const matchesQ = p.name.toLowerCase().includes(q) || p.code.toLowerCase().includes(q);
    const matchesCat = cat === 'Barchasi' || p.category === cat;
    return p.isActive && matchesQ && matchesCat;
  });
  document.getElementById('catalogGrid').innerHTML = filtered.map(cardHtml).join('') || '<div class="empty">Hech narsa topilmadi.</div>';
}

/* ---------- PRODUCT PAGE ---------- */
function renderProductPage(slug){
  const p = products.find(x=>x.slug === slug);
  if(!p) return `<a class="back-link" href="#catalog">&larr; Katalogga qaytish</a><div class="empty">Mahsulot topilmadi.</div>`;
  return `
    <a class="back-link" href="#catalog">&larr; Katalogga qaytish</a>
    <div class="product-wrap">
      <model-viewer src="${p.glbUrl}" camera-controls auto-rotate ar shadow-intensity="1" exposure="1"></model-viewer>
      <div class="info-panel">
        <h1>${p.name}</h1>
        <div class="code">Kod: ${p.code} · ${p.category || ''}</div>
        <div class="dim-row"><span>Uzunlik</span><b>${p.lengthMm} mm</b></div>
        <div class="dim-row"><span>Balandlik</span><b>${p.heightMm} mm</b></div>
        ${p.thicknessMm ? `<div class="dim-row"><span>Qalinlik</span><b>${p.thicknessMm} mm</b></div>` : ''}
        <div class="desc">${p.description || ''}</div>
        <div class="qr-box">
          <img id="qrImg" width="160" height="160" alt="QR kod" style="border:1px solid var(--line); border-radius:4px;">
          <p>Ushbu QR kodni skanerlab, mahsulotni telefon orqali ham ko'rish mumkin</p>
        </div>
      </div>
    </div>
  `;
}
function drawQR(slug){
  const img = document.getElementById('qrImg');
  if(!img) return;
  const url = `${location.origin}${location.pathname}#product/${slug}`;
  img.src = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&margin=8&data=${encodeURIComponent(url)}`;
}

/* ---------- ADMIN PAGE ---------- */
function renderAdmin(){
  return `
    <div class="admin-grid">
      <div>
        <div class="form-box">
          <h3>Yangi mahsulot qo'shish</h3>
          <label>Nomi</label>
          <input id="f_name" placeholder="Masalan: Temir darvoza №002">
          <label>Kod</label>
          <input id="f_code" placeholder="GT-002">
          <label>Kategoriya</label>
          <input id="f_category" placeholder="Darvozalar">
          <label>Uzunlik (mm)</label>
          <input id="f_length" type="number">
          <label>Balandlik (mm)</label>
          <input id="f_height" type="number">
          <label>Qalinlik (mm, ixtiyoriy)</label>
          <input id="f_thickness" type="number">
          <label>Rasm URL</label>
          <input id="f_image" placeholder="https://...">
          <div class="hint">Prototipda fayl yuklash yo'q — hozircha URL orqali kiritiladi.</div>
          <label>3D model (.glb) URL</label>
          <input id="f_glb" placeholder="https://.../model.glb">
          <label>Tavsif</label>
          <textarea id="f_desc"></textarea>
          <button class="btn-primary" onclick="addProduct()">Mahsulot qo'shish</button>
        </div>
      </div>
      <div>
        <h3 style="margin-bottom:12px;">Mavjud mahsulotlar (${products.length})</h3>
        <table>
          <thead><tr><th>Kod</th><th>Nomi</th><th>Holat</th><th></th></tr></thead>
          <tbody>
            ${products.map(p=>`
              <tr>
                <td>${p.code}</td>
                <td>${p.name}</td>
                <td>${p.isActive ? 'Faol' : 'Yashirilgan'}</td>
                <td class="row-actions">
                  <button onclick="navigate('product','${p.slug}')">Ko'rish</button>
                  <button onclick="toggleActive('${p.id}')">${p.isActive ? 'Yashirish' : 'Faollashtirish'}</button>
                  <button class="del" onclick="deleteProduct('${p.id}')">O'chirish</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}
function slugify(str){
  return str.toString().toLowerCase().trim()
    .replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)+/g,'') || 'product-' + Date.now();
}
function addProduct(){
  const name = document.getElementById('f_name').value.trim();
  const code = document.getElementById('f_code').value.trim();
  if(!name || !code){ alert('Nomi va kod majburiy.'); return; }
  const p = {
    id: crypto.randomUUID(),
    slug: slugify(code || name),
    code,
    name,
    category: document.getElementById('f_category').value.trim(),
    description: document.getElementById('f_desc').value.trim(),
    imageUrl: document.getElementById('f_image').value.trim(),
    glbUrl: document.getElementById('f_glb').value.trim() || 'https://modelviewer.dev/shared-assets/models/Astronaut.glb',
    lengthMm: Number(document.getElementById('f_length').value) || 0,
    heightMm: Number(document.getElementById('f_height').value) || 0,
    thicknessMm: Number(document.getElementById('f_thickness').value) || null,
    isActive: true,
    createdAt: Date.now()
  };
  products.push(p);
  saveProducts(products);
  render();
}
function toggleActive(id){
  const p = products.find(x=>x.id===id);
  if(p){ p.isActive = !p.isActive; saveProducts(products); render(); }
}
function deleteProduct(id){
  if(!confirm('Rostdan ham o\'chirmoqchimisiz?')) return;
  products = products.filter(x=>x.id!==id);
  saveProducts(products);
  render();
}
</script>
</body>
</html>
